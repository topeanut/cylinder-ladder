name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 타입 검사는 build가 겸한다(tsc -b && vite build).
      - run: npm run lint
      - run: npm test
      - run: npm run build
