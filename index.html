<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="회식에서 사람을 랜덤으로 뽑는 3D 원기둥 룰렛. 서버 없이 동작하고 URL만 공유하면 상태가 그대로 복원됩니다."
    />
    <title>전능 회식 메뉴 3D 원기둥형 스레드</title>
    <script>
      // 첫 페인트 전에 테마를 확정해 다크모드 깜빡임(FOUC)을 막는다.
      try {
        var saved = localStorage.getItem('hoesik-picker:theme')
        var dark = saved
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {
        /* 프라이빗 모드 등에서 localStorage 접근 실패 — 시스템 기본값 유지 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
